name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API test suite
        run: npm test
        env:
          CI: true
          # Optional: add a REQRES_API_KEY secret in the repo settings
          # (Settings -> Secrets and variables -> Actions) if you hit rate
          # limits on the shared reqres.in free tier.
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
