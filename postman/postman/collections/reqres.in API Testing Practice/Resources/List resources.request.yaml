$kind: http-request
url: "{{baseUrl}}/unknown"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200)\r

      })\r

      \r

      pm.test(\"Response is paginated and has a data array\", function () {\r

      \    const body = pm.response.json()\r

      \    pm.expect(body.page).to.eql(1)\r

      \    pm.expect(body).to.have.property(\"total_pages\")\r

      \    pm.expect(body.data).to.be.an(\"array\").that.is.not.empty;\r

      })\r

      \r

      pm.test(\"First color matches expected shape\", function () {\r

      \    const color = pm.response.json().data[0]\r

      \    pm.expect(color).to.have.all.keys('id', 'name', 'year', 'color', 'pantone_value')\r

      })\r

      \r

      pm.test(\"Response time is under 500ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(500)\r

      })"
    language: text/javascript
order: 1788321661463
