$kind: http-request
url: "{{baseUrl}}/users?page=9999"
method: GET
queryParams:
  page: "9999"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 (still succeeds, just empty)', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Data array is empty', function () {
          pm.expect(pm.response.json().data).to.be.an('array').that.is.empty;
      });
    language: text/javascript
order: 2000
